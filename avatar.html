<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petit Nuage ☁️ — Robot 3D LeePerrySmith GLSL</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at center, #1b003a 0%, #0a0017 60%, #03000a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Cyberpunk CRT Scanline Overlay */
    .crt-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      opacity: 0.4;
    }

    /* Sci-Fi HUD Reticles */
    .hud-frame {
      position: absolute;
      inset: 20px;
      z-index: 3;
      pointer-events: none;
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      box-shadow: inset 0 0 40px rgba(0, 240, 255, 0.05);
    }
    .hud-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #00f0ff;
      border-style: solid;
    }
    .hud-corner.tl { top: -1px; left: -1px; border-width: 3px 0 0 3px; }
    .hud-corner.tr { top: -1px; right: -1px; border-width: 3px 3px 0 0; }
    .hud-corner.bl { bottom: -1px; left: -1px; border-width: 0 0 3px 3px; }
    .hud-corner.br { bottom: -1px; right: -1px; border-width: 0 3px 3px 0; }

    /* UI Overlay */
    .ui-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      pointer-events: none;
      margin-top: auto;
      margin-bottom: 2.5rem;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(27, 0, 58, 0.85);
      backdrop-filter: blur(16px);
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 25px rgba(0, 240, 255, 0.3);
      font-size: 1.1rem;
      font-family: 'Share Tech Mono', monospace;
      font-weight: 600;
      transition: all 0.3s ease;
      pointer-events: auto;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #00f0ff;
      box-shadow: 0 0 14px #00f0ff;
      transition: all 0.3s ease;
    }
    .status-badge.speaking {
      border-color: rgba(236, 72, 153, 0.8);
      background: rgba(236, 72, 153, 0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 35px rgba(236, 72, 153, 0.5);
    }
    .status-badge.speaking .status-dot {
      background-color: #ec4899;
      box-shadow: 0 0 18px #ec4899;
      animation: blink-dot 0.5s infinite alternate;
    }
    @keyframes blink-dot {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .subtitle-box {
      max-width: 620px;
      text-align: center;
      font-size: 1.15rem;
      font-family: 'Share Tech Mono', monospace;
      color: #cbd5e1;
      background: rgba(27, 0, 58, 0.8);
      backdrop-filter: blur(12px);
      padding: 0.75rem 1.75rem;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      line-height: 1.5;
      min-height: 3.2rem;
      transition: all 0.3s ease;
      opacity: 0.9;
      pointer-events: auto;
    }
    .subtitle-box.active {
      color: #00f0ff;
      border-color: rgba(0, 240, 255, 0.6);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      opacity: 1;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="crt-overlay"></div>
  <div class="hud-frame">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <div class="ui-overlay">
    <div class="status-badge" id="status-badge">
      <div class="status-dot"></div>
      <span id="status-text">PETIT NUAGE ☁️ — CHARGEMENT 3D...</span>
    </div>
    <div class="subtitle-box" id="subtitle-box">
      Attente d'interaction vocale...
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. THREE.JS SCENE, CAMERA & RENDERER
    // =========================================================================
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0017, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 14);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;

    let controls = null;
    if (typeof THREE.OrbitControls !== 'undefined') {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 25;
      controls.minDistance = 5;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 2. LIGHTING (Studio Key Light + Pink Rim + Cyan Rim)
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0x2e0854, 2.0);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(3, 5, 5);
    scene.add(keyLight);

    const rimPink = new THREE.DirectionalLight(0xec4899, 3.5);
    rimPink.position.set(5, -2, -3);
    scene.add(rimPink);

    const rimCyan = new THREE.DirectionalLight(0x00f0ff, 3.0);
    rimCyan.position.set(-5, 3, -2);
    scene.add(rimCyan);


    // =========================================================================
    // 3. CUSTOM GLSL HEAD SHADER & BIONIC IRIS SHADER
    // =========================================================================

    // A. Custom GLSL Chrome Bionic Shader for LeePerrySmith Mesh
    const headShaderUniforms = {
      uTime: { value: 0.0 },
      uSpeaking: { value: 0.0 },
      uColorBase: { value: new THREE.Color(0xd1d5db) },
      uColorCyan: { value: new THREE.Color(0x00f0ff) },
      uColorPink: { value: new THREE.Color(0xec4899) }
    };

    const headVertexShader = `
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const headFragmentShader = `
      uniform float uTime;
      uniform float uSpeaking;
      uniform vec3 uColorBase;
      uniform vec3 uColorCyan;
      uniform vec3 uColorPink;

      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(vViewPosition);

        // Chrome Metallic Specular
        float metallic = pow(max(0.0, dot(N, vec3(0.5, 0.8, 0.5))), 16.0);

        // Cyan & Pink Rim Light Glow
        float fresnel = pow(1.0 - max(0.0, dot(N, V)), 2.5);
        vec3 rimGlow = mix(uColorCyan, uColorPink, uSpeaking * 0.8) * fresnel * 0.8;

        vec3 finalColor = uColorBase * (0.35 + metallic * 0.65) + rimGlow;
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    const customHeadMaterial = new THREE.ShaderMaterial({
      uniforms: headShaderUniforms,
      vertexShader: headVertexShader,
      fragmentShader: headFragmentShader
    });

    // B. Custom GLSL Bionic Iris Eye Shader (Matching Reference Image!)
    const eyeShaderUniforms = {
      uTime: { value: 0.0 },
      uPupilSize: { value: 0.22 },
      uSpeaking: { value: 0.0 }
    };

    const eyeVertexShader = `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const eyeFragmentShader = `
      uniform float uTime;
      uniform float uPupilSize;
      uniform float uSpeaking;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vec2 st = vUv - vec2(0.5);
        float dist = length(st);
        float angle = atan(st.y, st.x);

        // Cyan Center (#00f0ff) -> Magenta Outer Edge (#ec4899)
        vec3 cyanCore = vec3(0.0, 0.94, 1.0);
        vec3 magentaEdge = vec3(0.92, 0.28, 0.6);
        vec3 darkSocket = vec3(0.02, 0.05, 0.1);

        // Radial Iris Fibers
        float fibers = sin(angle * 36.0 + uTime * 2.0) * 0.5 + 0.5;
        float fineFibers = sin(angle * 72.0 - uTime * 3.0) * 0.5 + 0.5;

        // Blend Iris Colors
        vec3 irisColor = mix(cyanCore, magentaEdge, smoothstep(0.18, 0.42, dist));
        irisColor += vec3(fibers * 0.25 + fineFibers * 0.15);

        // Black Central Dilating Pupil
        float pupil = smoothstep(uPupilSize, uPupilSize - 0.03, dist);
        vec3 finalColor = mix(irisColor, vec3(0.0), pupil);

        // Dark Rim
        float outerRim = smoothstep(0.44, 0.48, dist);
        finalColor = mix(finalColor, darkSocket, outerRim);

        // Glass Specular Dome Reflection
        vec3 N = normalize(vNormal);
        vec3 V = normalize(vViewPosition);
        float fresnel = pow(1.0 - max(0.0, dot(N, V)), 3.0);
        finalColor += vec3(fresnel * 0.6);

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    const bionicIrisMaterial = new THREE.ShaderMaterial({
      uniforms: eyeShaderUniforms,
      vertexShader: eyeVertexShader,
      fragmentShader: eyeFragmentShader
    });

    const chromeBezelMat = new THREE.MeshStandardMaterial({
      color: 0xd1d5db,
      metalness: 0.96,
      roughness: 0.12
    });

    const darkSteelMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      metalness: 0.9,
      roughness: 0.25
    });


    // =========================================================================
    // 4. BUILD 3D SCENE: LeePerrySmith.glb + ANIMATED BIONIC IRIS EYES
    // =========================================================================
    const headGroup = new THREE.Group();
    scene.add(headGroup);

    let headMeshModel = null;

    // Create Animated Bionic Eye Assemblies (Matching Reference Image!)
    function createBionicEye() {
      const eyeGroup = new THREE.Group();

      // Outer Beveled Chrome Aperture Ring
      const ringGeo = new THREE.TorusGeometry(0.24, 0.04, 16, 32);
      const ringMesh = new THREE.Mesh(ringGeo, chromeBezelMat);
      eyeGroup.add(ringMesh);

      // Inner Dark Steel Socket Lip
      const innerRingGeo = new THREE.TorusGeometry(0.20, 0.02, 12, 24);
      const innerRing = new THREE.Mesh(innerRingGeo, darkSteelMat);
      eyeGroup.add(innerRing);

      // Bionic Iris Lens Sphere
      const irisGeo = new THREE.SphereGeometry(0.18, 32, 32);
      const irisMesh = new THREE.Mesh(irisGeo, bionicIrisMaterial);
      eyeGroup.add(irisMesh);

      // 6 Mechanical Cable Plugs around the Eye Perimeter
      for (let i = 0; i < 6; i++) {
        const plugAng = (i / 6.0) * Math.PI * 2.0;
        const plugGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.06, 12);
        const plugMesh = new THREE.Mesh(plugGeo, chromeBezelMat);
        plugMesh.position.set(Math.cos(plugAng) * 0.22, Math.sin(plugAng) * 0.22, 0);
        plugMesh.rotation.z = plugAng + Math.PI / 2;
        eyeGroup.add(plugMesh);
      }

      return eyeGroup;
    }

    // Left & Right Eye Assemblies (Avancés à Z = 2.10)
    const eyeLeftAssembly = createBionicEye();
    eyeLeftAssembly.position.set(-0.76, 0.90, 2.10);
    eyeLeftAssembly.scale.set(0.75, 0.75, 0.75);
    headGroup.add(eyeLeftAssembly);

    const eyeRightAssembly = createBionicEye();
    eyeRightAssembly.position.set(0.46, 0.90, 2.10);
    eyeRightAssembly.scale.set(0.75, 0.75, 0.75);
    headGroup.add(eyeRightAssembly);

    // Eye Lights casting cyan & magenta glows
    const eyeLightL = new THREE.PointLight(0x00f0ff, 4.0, 3);
    eyeLightL.position.set(-0.76, 0.90, 2.30);
    headGroup.add(eyeLightL);

    const eyeLightR = new THREE.PointLight(0x00f0ff, 4.0, 3);
    eyeLightR.position.set(0.46, 0.90, 2.30);
    headGroup.add(eyeLightR);

    // Mechanical Neck Bust Base
    const neckGeo = new THREE.CylinderGeometry(0.7, 1.2, 2.5, 24);
    const neckMesh = new THREE.Mesh(neckGeo, darkSteelMat);
    neckMesh.position.set(0, -2.6, -0.2);
    headGroup.add(neckMesh);


    // LOAD LeePerrySmith.glb 3D MODEL
    const loader = new THREE.GLTFLoader();
    const modelUrls = [
      '/LeePerrySmith.glb',
      'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb'
    ];

    function loadModel(index = 0) {
      if (index >= modelUrls.length) return;

      loader.load(
        modelUrls[index],
        (gltf) => {
          console.log("Modèle LeePerrySmith.glb chargé !");
          const model = gltf.scene;

          // Apply Custom GLSL Bionic Chrome Shader
          model.traverse((child) => {
            if (child.isMesh) {
              child.material = customHeadMaterial;
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          model.scale.set(1.1, 1.1, 1.1);
          model.position.set(0, -1, 0);
          headGroup.add(model);
          headMeshModel = model;

          document.getElementById('status-text').textContent = "PETIT NUAGE ☁️ — 3D LeePerrySmith GLSL ACTIF";
        },
        undefined,
        (err) => {
          console.warn("Re-tentative de chargement du modèle 3D...", err);
          loadModel(index + 1);
        }
      );
    }

    loadModel(0);


    // Mouse tracking for dynamic bionic gaze
    let mouse = { x: 0, y: 0 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // =========================================================================
    // 5. ANIMATION LOOP & REAL-TIME WEBSOCKET LIP-SYNC
    // =========================================================================
    let isSpeaking = false;
    let targetJawOpen = 0;
    let currentJawOpen = 0;
    let speakPhase = 0;

    let targetGazeX = 0;
    let targetGazeY = 0;

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      if (controls) controls.update();

      // Update Custom GLSL Shader Uniforms
      headShaderUniforms.uTime.value = time;
      eyeShaderUniforms.uTime.value = time;

      // Floating Motion
      headGroup.position.y = Math.sin(time * 1.5) * 0.12;

      // Dynamic Gaze Tracking & Natural Micro-Saccades
      let gazeTargetX = mouse.y * 0.18;
      let gazeTargetY = mouse.x * 0.18;

      if (Math.random() < 0.02) {
        gazeTargetX += (Math.random() - 0.5) * 0.12;
        gazeTargetY += (Math.random() - 0.5) * 0.12;
      }

      targetGazeX += (gazeTargetX - targetGazeX) * 0.12;
      targetGazeY += (gazeTargetY - targetGazeY) * 0.12;

      // Rotate inner Iris meshes to simulate eye movement
      eyeLeftAssembly.children[2].rotation.x = targetGazeX;
      eyeLeftAssembly.children[2].rotation.y = targetGazeY;

      eyeRightAssembly.children[2].rotation.x = targetGazeX;
      eyeRightAssembly.children[2].rotation.y = targetGazeY;

      // Rotate Outer Eye Bezel Rings slowly
      eyeLeftAssembly.children[0].rotation.z += 0.005;
      eyeRightAssembly.children[0].rotation.z -= 0.005;

      // Real-Time Voice Lip Sync & Pupil Dilation
      if (isSpeaking) {
        speakPhase += 0.28;
        const wave = Math.sin(speakPhase) * 0.5 + 0.5;
        const waveNoise = Math.cos(speakPhase * 1.7) * 0.5 + 0.5;
        targetJawOpen = (wave * waveNoise * 0.28) + (Math.random() * 0.05);

        // Dilate Pupils on Speech Syllables
        eyeShaderUniforms.uPupilSize.value = 0.18 + (wave * 0.08);
        headShaderUniforms.uSpeaking.value = 1.0;

        eyeLightL.intensity = 3.2 + (wave * 1.5);
        eyeLightR.intensity = 3.2 + (wave * 1.5);
      } else {
        targetJawOpen = 0;
        eyeShaderUniforms.uPupilSize.value = 0.22;
        headShaderUniforms.uSpeaking.value = 0.0;

        eyeLightL.intensity = 2.5;
        eyeLightR.intensity = 2.5;
      }

      currentJawOpen += (targetJawOpen - currentJawOpen) * 0.35;

      if (headMeshModel) {
        headMeshModel.rotation.x = currentJawOpen * 0.3;
        headMeshModel.position.y = -1 - currentJawOpen * 0.15;
      }

      renderer.render(scene, camera);
    }

    animate();


    // =========================================================================
    // 6. WEBSOCKET REAL-TIME SYNC CONTROL
    // =========================================================================
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const subtitleBox = document.getElementById('subtitle-box');

    function setSpeakingState(speaking, text = "") {
      isSpeaking = speaking;
      if (speaking) {
        statusBadge.classList.add('speaking');
        statusText.textContent = "🔊 PETIT NUAGE PARLE DANS DISCORD !";
        if (text) {
          subtitleBox.textContent = `"${text}"`;
          subtitleBox.classList.add('active');
        }
      } else {
        statusBadge.classList.remove('speaking');
        statusText.textContent = "PETIT NUAGE ☁️ — 3D LeePerrySmith GLSL ACTIF";
        subtitleBox.classList.remove('active');
      }
    }

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusText.textContent = "PETIT NUAGE ☁️ — CONNECTÉ (3D SYNC ACTIVE)";
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "speaking") {
            setSpeakingState(data.value, data.text || "");
          }
        } catch (e) {
          console.error("WS Parse error:", e);
        }
      };

      ws.onclose = () => {
        statusText.textContent = "RECONNEXION WEBSOCKET...";
        setSpeakingState(false);
        setTimeout(connectWS, 3000);
      };
    }

    connectWS();
  </script>
</body>
</html>
