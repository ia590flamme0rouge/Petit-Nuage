<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avatar 3D — Lip-sync (approche A)</title>
<style>
  :root{
    --bg: #0b0e12;
    --panel: #12161c;
    --panel-border: #232a34;
    --text: #d7dde5;
    --dim: #6d7887;
    --accent: #4fd1a5;
    --accent-dim: #2b6b57;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--mono);
    overflow: hidden;
  }
  #viewport { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 16px; left: 16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
    width: 300px;
    font-size: 12px;
    line-height: 1.5;
    z-index: 10;
  }
  #hud h1 {
    font-size: 13px; margin: 0 0 10px 0; color: var(--accent);
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .row { display:flex; justify-content: space-between; margin: 4px 0; color: var(--dim); }
  .row b { color: var(--text); font-weight: 500; }

  #dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#555; margin-right:6px; transition: background .15s ease; }
  #dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  button {
    font-family: var(--mono); font-size: 12px;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 6px; padding: 8px 10px;
    cursor: pointer; width: 100%; margin-top: 10px;
    transition: background .15s ease;
  }
  button:hover { background: rgba(79,209,165,0.08); }
  button:active { background: rgba(79,209,165,0.18); }

  #loading {
    position: fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color: var(--dim); font-size: 13px; z-index: 20; background: var(--bg);
  }
</style>
</head>
<body>

<div id="loading">Chargement du modèle…</div>

<div id="hud">
  <h1>Avatar — lip-sync (approche A)</h1>
  <div class="row"><span><span id="dot"></span>État</span><b id="stateLabel">silencieux</b></div>
  <div class="row"><span>Vertices affectés</span><b id="vertCount">–</b></div>
  <div class="row"><span>Jaw open</span><b id="jawVal">0.00</b></div>
  <button id="toggleBtn">Simuler "parle" (test manuel)</button>
</div>

<div id="viewport"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ============================================================
   1) SCENE / CAMERA / RENDERER
   ============================================================ */
const viewport = document.getElementById("viewport");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e12);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.01, 100
);
camera.position.set(0, 1.45, 1.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, 0);
controls.enableDamping = true;
controls.minDistance = 0.5;
controls.maxDistance = 5;
controls.update();

// Lighting — simple 3-point setup
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(0.6, 1.9, 1.2);
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb8ff, 0.6);
fill.position.set(-1, 1.4, 0.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x4fd1a5, 0.5);
rim.position.set(0, 1.2, -1.5);
scene.add(rim);

const ambient = new THREE.AmbientLight(0x2a3138, 1.2);
scene.add(ambient);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   2) FAKE-JAW LIP-SYNC ENGINE
   ------------------------------------------------------------
   Ce modèle GLB n'a ni squelette ni blend shapes (vérifié par
   inspection : un seul mesh "BODY", pas de JOINTS/WEIGHTS, pas
   de morph targets). Impossible d'animer une vraie "bone jaw".

   Solution (approche A) : on repère les vertices du bas du
   visage (menton / lèvre inférieure) par leur position Y/X/Z
   locale, et on les fait pivoter autour d'un point de pivot
   proche de la charnière de la mâchoire (hauteur des oreilles),
   avec un poids qui s'estompe en douceur (smoothstep) vers le
   reste du visage pour éviter toute déchirure de maillage.

   Coordonnées calibrées sur free_head_mesh_01.glb :
     - bounding box BODY : Y ∈ [1.286, 1.616], X ∈ [-0.162,0.162]
     - lèvre sup / base du nez : Y ≈ 1.46–1.465
     - lèvre inf / menton     : Y ≈ 1.395–1.44
     - pivot mâchoire (≈ oreilles) : Y ≈ 1.463, Z ≈ 0.01

   Si tu réutilises ce code avec un AUTRE modèle, réajuste les
   constantes ci-dessous (ou régénère-les avec le même script
   d'inspection de vertices).
   ============================================================ */

const JAW = {
  pivotY: 1.463,
  pivotZ: 0.01,
  maxAngle: 0.26, // radians (~15°) — amplitude d'ouverture max

  // trapèze de poids sur Y (bas du visage = poids 1)
  yFadeLowStart: 1.355,  // 0 sous le cou
  yFadeLowEnd:   1.395,  // 1 à partir du bas du menton
  yFadeHighStart:1.44,   // encore 1 (lèvre inférieure)
  yFadeHighEnd:  1.465,  // 0 à la lèvre supérieure / nez

  // limite latérale (exclut les oreilles)
  xFadeInEnd:  0.045,
  xFadeOutEnd: 0.08,

  // ne garder que la face avant (exclut oreilles / arrière crâne)
  zFadeInEnd:  0.01,
  zFadeOutEnd: -0.03,
};

function smoothstep(edge0, edge1, x) {
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function trapezoidWeightY(y) {
  const rising  = smoothstep(JAW.yFadeLowStart, JAW.yFadeLowEnd, y);
  const falling = 1 - smoothstep(JAW.yFadeHighStart, JAW.yFadeHighEnd, y);
  return Math.min(rising, falling);
}

function weightX(x) {
  return 1 - smoothstep(JAW.xFadeInEnd, JAW.xFadeOutEnd, Math.abs(x));
}

function weightZ(z) {
  // full weight for z above zFadeInEnd, fades to 0 by zFadeOutEnd
  const t = Math.min(1, Math.max(0,
    (z - JAW.zFadeOutEnd) / (JAW.zFadeInEnd - JAW.zFadeOutEnd)));
  return t * t * (3 - 2 * t);
}

/**
 * Prépare une géométrie pour l'effet "fake jaw" :
 * - sauvegarde les positions d'origine
 * - calcule un poids par vertex
 * - ajoute un attribut "jawWeight" (utile pour debug / shader)
 */
function prepareJawGeometry(geometry) {
  const pos = geometry.attributes.position;
  const count = pos.count;

  const original = new Float32Array(pos.array); // copie des positions d'origine
  const weights = new Float32Array(count);

  let affected = 0;
  for (let i = 0; i < count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const w = trapezoidWeightY(y) * weightX(x) * weightZ(z);
    weights[i] = w;
    if (w > 0.02) affected++;
  }

  geometry.setAttribute("jawWeight", new THREE.BufferAttribute(weights, 1));

  return { original, weights, count, affected };
}

/**
 * Applique la rotation de mâchoire pour un angle donné (radians)
 * en repartant toujours des positions d'origine (pas cumulatif).
 */
function applyJawAngle(geometry, jawData, theta) {
  const pos = geometry.attributes.position;
  const { original, weights, count } = jawData;

  if (theta === 0) {
    // reset rapide vers la position d'origine
    pos.array.set(original);
    pos.needsUpdate = true;
    return;
  }

  const cos = Math.cos(theta);
  const sin = Math.sin(theta);

  for (let i = 0; i < count; i++) {
    const w = weights[i];
    const ox = original[i * 3 + 0];
    const oy = original[i * 3 + 1];
    const oz = original[i * 3 + 2];

    if (w <= 0.001) {
      pos.setXYZ(i, ox, oy, oz);
      continue;
    }

    // rotation autour de l'axe X au pivot (pivotY, pivotZ), pondérée par w
    const localTheta = theta * w;
    const c = Math.cos(localTheta);
    const s = Math.sin(localTheta);

    const dy = oy - JAW.pivotY;
    const dz = oz - JAW.pivotZ;

    const ny = JAW.pivotY + (dy * c - dz * s);
    const nz = JAW.pivotZ + (dy * s + dz * c);

    pos.setXYZ(i, ox, ny, nz);
  }

  pos.needsUpdate = true;
  geometry.computeVertexNormals();
}

/* ============================================================
   3) CHARGEMENT DU MODÈLE
   ============================================================ */

let jawMesh = null;
let jawData = null;

const loader = new GLTFLoader();
loader.load(
  "./free_head_mesh_01.glb",
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    model.traverse((obj) => {
      if (obj.isMesh && obj.name.toUpperCase().includes("BODY")) {
        jawMesh = obj;
        jawMesh.geometry = jawMesh.geometry.clone(); // sécurité : ne pas partager le buffer
        jawData = prepareJawGeometry(jawMesh.geometry);
        document.getElementById("vertCount").textContent = jawData.affected;
      }
    });

    document.getElementById("loading").style.display = "none";
  },
  undefined,
  (err) => {
    document.getElementById("loading").textContent =
      "Erreur de chargement du .glb — vérifie que free_head_mesh_01.glb est bien à côté de ce fichier HTML.";
    console.error(err);
  }
);

/* ============================================================
   4) ÉTAT "SPEAKING" + BOUCLE D'ANIMATION
   ============================================================ */

let speaking = false;
let currentJawOpen = 0;      // valeur lissée, 0..1
let targetAmplitude = 0;     // ce vers quoi on tend quand speaking = true

const clock = new THREE.Clock();

// Fonction publique — c'est celle que ton WebSocket doit appeler.
window.setSpeakingState = function (isSpeaking) {
  speaking = !!isSpeaking;
  updateHud();
};

// Optionnel : si tu as un niveau d'amplitude audio en temps réel (0..1)
// (ex: analyseur Web Audio côté client, ou valeur envoyée par le bot),
// tu peux appeler ça à la place / en complément de setSpeakingState pour
// un rendu plus réactif que la boucle générique ci-dessous.
window.setSpeakingAmplitude = function (amp01) {
  speaking = amp01 > 0.02;
  targetAmplitude = Math.min(1, Math.max(0, amp01));
};

function updateHud() {
  document.getElementById("stateLabel").textContent = speaking ? "parle" : "silencieux";
  document.getElementById("dot").classList.toggle("on", speaking);
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  if (jawMesh && jawData) {
    let amp;
    if (speaking) {
      // Mouvement générique "parle" : superposition de sinusoïdes
      // à fréquences différentes pour un rythme moins mécanique
      // qu'une simple boucle sinus unique (approximation de syllabes).
      const wobble =
        0.55 * (0.5 + 0.5 * Math.sin(t * 9.0)) +
        0.30 * (0.5 + 0.5 * Math.sin(t * 13.5 + 1.3)) +
        0.15 * (0.5 + 0.5 * Math.sin(t * 21.0 + 0.4));
      amp = 0.15 + 0.85 * wobble; // garde toujours un peu d'ouverture, jamais totalement fermé
    } else {
      amp = 0;
    }

    // amplitude audio externe (si utilisée) prend le dessus doucement
    const finalTarget = speaking ? amp : 0;

    // lissage attaque/relâche pour éviter les à-coups (surtout à l'arrêt)
    const smoothing = speaking ? 18 : 10; // vitesse de convergence
    currentJawOpen += (finalTarget - currentJawOpen) * Math.min(1, smoothing * dt);

    document.getElementById("jawVal").textContent = currentJawOpen.toFixed(2);

    applyJawAngle(jawMesh.geometry, jawData, currentJawOpen * JAW.maxAngle);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   5) BOUTON DE TEST MANUEL
   ============================================================ */
const toggleBtn = document.getElementById("toggleBtn");
toggleBtn.addEventListener("click", () => {
  window.setSpeakingState(!speaking);
  toggleBtn.textContent = speaking
    ? "Arrêter la simulation"
    : 'Simuler "parle" (test manuel)';
});

/* ============================================================
   6) INTÉGRATION WEBSOCKET SERVEUR DISCORD
   ============================================================ */
function connectAvatarWebSocket() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${location.host}/ws`;
  console.log("[avatar] Connexion WebSocket :", wsUrl);

  const ws = new WebSocket(wsUrl);

  ws.onopen = () => console.log("[avatar] WebSocket connecté au bot Petit Nuage");

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      console.log("[avatar] Événement reçu:", data);
      if (data.type === "speaking") {
        window.setSpeakingState(data.value);
      }
      if (typeof data.amplitude === "number") {
        window.setSpeakingAmplitude(data.amplitude);
      }
    } catch (e) {
      console.error("[avatar] Erreur décodage WS:", e);
    }
  };

  ws.onclose = () => {
    console.log("[avatar] WebSocket déconnecté, reconnexion dans 3s...");
    window.setSpeakingState(false);
    setTimeout(connectAvatarWebSocket, 3000);
  };

  ws.onerror = (e) => {
    console.error("[avatar] Erreur WS:", e);
    ws.close();
  };

  return ws;
}

connectAvatarWebSocket();
</script>
</body>
</html>
